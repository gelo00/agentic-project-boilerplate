services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: sh -c "npx drizzle-kit migrate && npx tsx src/server.ts"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      JWT_SECRET: replace-this-with-a-production-secret
      CORS_ORIGIN: http://localhost:3000
      REDIS_ENABLED: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
